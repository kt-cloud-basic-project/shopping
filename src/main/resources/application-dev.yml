spring:
  datasource:
    url: jdbc:mysql://${db.host}:${db.port}/${db.scheme}
    username: ${db.username}
    password: ${db.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    show-sql: true
  data:
    redis:
      ssl:
        enabled: false
      cluster:
        nodes: ${redis.host}
        max-redirects: 3
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail-username}
    password: ${mail-password}

jwt:
  secret: ${kt.jwt.secret}
  access-token-expiration: ${kt.jwt.access-token-expiration:300000}
  refresh-token-expiration: ${kt.jwt.refresh-token-expiration:43200000}

slack:
  bot-token: ${slack.token}
  log-channel: ${slack.channel}

server:
  port: ${shopping.server.port}

logstash:
  host: ${logstashhost:localhost}
  port: ${logstashport:9601}

toss:
  payments:
    client-key: ${payment.client.key:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
    secret-key: ${payments.secret-key:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
    api-url: ${payments.api-url:https://api.tosspayments.com/v1/payments}
