spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopping
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    show-sql: true
  data:
    redis:
        host: localhost
        port: 6379
        ssl:
          enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${mail-username}
    password: ${mail-password}

    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true
  ai:
    model:
      embedding: text-embedding-3-small
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          temperature: 1
          model: o4-mini

jwt:
  secret: ${kt.jwt.secret}
  access-token-expiration: 300000
  refresh-token-expiration: 43200000

slack:
  bot-token: ${slack.token}
  log-channel: ${slack.channel}

server:
  port: 8080